<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1090" width="1280" height="1090">
<style>
  text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'SimHei', sans-serif; }
  .ts { font-size: 13px; font-weight: 600; fill: #111827; }
  .ss { font-size: 11px; fill: #6b7280; }
