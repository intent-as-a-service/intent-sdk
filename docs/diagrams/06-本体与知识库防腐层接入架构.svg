<text class="ss" x="792" y="868" text-anchor="middle">entityIdValidator</text>
<text class="ss" x="792" y="886" text-anchor="middle">本仓待建 · 复用实体候选链路</text>
<rect x="952" y="826" width="264" height="84" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
