  <marker id="ar-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
  </marker>
</defs>
<rect width="1280" height="1090" fill="#ffffff"/>
<text class="ti" x="44" y="34">意图执行 · 能力端口与内置能力工具接入架构</text>
<rect x="44" y="56" width="1192" height="146" rx="10" ry="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" stroke-dasharray="6,4"/>
<text class="bd" x="58" y="77">MCP 客户端 · 只读外部工具的通用入口（pi-java McpClient 已实现）</text>
<rect x="64" y="92" width="300" height="86" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="214" y="114" text-anchor="middle">MCP 知识库工具</text>
<text class="ss" x="214" y="134" text-anchor="middle">knowledge_search</text>
<text class="ss" x="214" y="152" text-anchor="middle">只读 · 无需用户身份</text>
<rect x="484" y="92" width="300" height="86" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="634" y="114" text-anchor="middle">MCP 本体 / 元数据工具</text>
<text class="ss" x="634" y="134" text-anchor="middle">describe_entity</text>
<text class="ss" x="634" y="152" text-anchor="middle">只读 · 无需用户身份</text>
<rect x="904" y="92" width="312" height="86" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>
<text class="ts" x="1060" y="114" text-anchor="middle">MCP 只读业务工具</text>
<text class="ss" x="1060" y="134" text-anchor="middle">外部系统只读查询</text>
<text class="ss" x="1060" y="152" text-anchor="middle">写操作 → 走意图网关（M2）</text>
<text class="an" x="44" y="222">MCP 是独立进程，拿不到宿主登录用户 —— 故只用于只读；需要身份与审批的写操作走意图网关。</text>
<rect x="44" y="244" width="1192" height="108" rx="10" ry="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" stroke-dasharray="6,4"/>
<text class="bd" x="58" y="265">意图执行层 · next-agent / intent-sdk-pi</text>
<rect x="204" y="278" width="190" height="58" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="299" y="300" text-anchor="middle">AgentExecutor</text>
<text class="ss" x="299" y="320" text-anchor="middle">主循环 · 合并两套工具</text>
<rect x="424" y="278" width="190" height="58" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="519" y="300" text-anchor="middle">FlowExecutor</text>
<text class="ss" x="519" y="320" text-anchor="middle">确定性流程编排</text>
<rect x="644" y="278" width="242" height="58" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="765" y="300" text-anchor="middle">HostToolRegistry</text>
<text class="ss" x="765" y="320" text-anchor="middle">宿主业务工具注册表</text>
<rect x="886" y="278" width="350" height="58" rx="8" ry="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text class="ts" x="1061" y="300" text-anchor="middle">CapabilityTools</text>
<text class="ss" x="1061" y="320" text-anchor="middle">能力工具注册表（由端口构造，不受意图白名单管辖）</text>
<rect x="44" y="374" width="1192" height="114" rx="10" ry="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" stroke-dasharray="6,4"/>
<text class="bd" x="58" y="395">业务宿主工具 · 进程内直调宿主 SDK（权限与事务随调用栈自动生效） · 受 IntentSpec.tools 白名单管辖</text>
<rect x="264" y="410" width="190" height="62" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="359" y="432" text-anchor="middle">CRM 业务工具</text>
<text class="ss" x="359" y="452" text-anchor="middle">IntentTool 实现</text>
<rect x="490" y="410" width="190" height="62" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="585" y="432" text-anchor="middle">合约业务工具</text>
<text class="ss" x="585" y="452" text-anchor="middle">IntentTool 实现</text>
<rect x="716" y="410" width="242" height="62" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="837" y="432" text-anchor="middle">MCP 工具适配器</text>
<text class="ss" x="837" y="452" text-anchor="middle">MCP → IntentTool</text>
<rect x="44" y="510" width="1192" height="108" rx="10" ry="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" stroke-dasharray="6,4"/>
<text class="bd" x="58" y="531">能力工具层 · 由能力端口构造的内置工具（SDK 提供，不受意图工具白名单管辖）</text>
<rect x="204" y="544" width="312" height="62" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="360" y="566" text-anchor="middle">knowledge_search</text>
<text class="ss" x="360" y="586" text-anchor="middle">数据型 · 模型按需检索，丰富上下文</text>
<rect x="624" y="544" width="312" height="62" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="780" y="566" text-anchor="middle">describe_entity / resolve_entity</text>
<text class="ss" x="780" y="586" text-anchor="middle">数据型 · 模型探索本体</text>
<rect x="44" y="640" width="1192" height="128" rx="10" ry="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="6,4"/>
<text class="bd" x="58" y="661">能力端口 ACL · 意图 SDK 定义的抽象（依赖倒置的"抽象"一端；外部术语到此为止）</text>
<rect x="64" y="674" width="552" height="84" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text class="ts" x="340" y="696" text-anchor="middle">«interface»  KnowledgeBase</text>
<text class="ss" x="340" y="716" text-anchor="middle">数据型端口 · kb / query / chunk · 可工具化</text>
<text class="ss" x="340" y="734" text-anchor="middle">supports(kb) · retrieve(kb, query, topK)</text>
<rect x="664" y="674" width="552" height="84" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text class="ts" x="940" y="696" text-anchor="middle">«interface»  Ontology</text>
<text class="ss" x="940" y="716" text-anchor="middle">约束型端口 · 实体 / 字段 / 关系</text>
<text class="ss" x="940" y="734" text-anchor="middle">candidateValues() → 参数 enum      validate() → 执行前准入</text>
<rect x="44" y="790" width="1192" height="138" rx="10" ry="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" stroke-dasharray="6,4"/>
<text class="bd" x="58" y="811">适配器层 · 每个实现翻译一家的术语（新增一家 = 新增一个实现，意图规范零改动）</text>
<rect x="64" y="826" width="272" height="84" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="200" y="848" text-anchor="middle">Yudao 知识库适配器</text>
<text class="ss" x="200" y="868" text-anchor="middle">AiKnowledgeSegmentService</text>
<text class="ss" x="200" y="886" text-anchor="middle">本仓待建 · 约 15 行</text>
