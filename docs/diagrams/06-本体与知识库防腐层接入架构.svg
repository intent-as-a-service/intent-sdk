<rect x="426" y="174" width="269" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
<text class="an" x="560" y="186" text-anchor="middle" fill="#9333ea">MCP 工具适配器 → 包成 KnowledgeBase / Ontology</text>
<path d="M 763,90 L 763,214 L 830,214 L 830,672" fill="none" stroke="purple" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ar-purple)"/>
<rect x="836" y="196" width="104" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
<text class="an" x="888" y="208" text-anchor="middle" fill="#9333ea">MCP → Ontology</text>
<rect x="44" y="1096" width="1192" height="96" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text class="lg" x="60" y="1120" font-weight="600">图例</text>
<line x1="104" y1="1116" x2="136" y2="1116" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar-blue)"/>
<text class="lg" x="142" y="1120">业务工具链路（受意图白名单）</text>
<line x1="358" y1="1116" x2="390" y2="1116" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-green)"/>
<text class="lg" x="396" y="1120">能力端口：依赖倒置（抽象 ← 外部实现）+ 确定性通道</text>
<line x1="764" y1="1116" x2="796" y2="1116" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ar-purple)"/>
<text class="lg" x="802" y="1120">MCP 工具通道（只读 / 无用户身份）</text>
<line x1="1076" y1="1116" x2="1108" y2="1116" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar-gray)"/>
<text class="lg" x="1114" y="1120">适配器 → 客户既有系统</text>
<text class="lg" x="60" y="1146">能力端口与业务工具彻底分开：业务工具受 IntentSpec.tools 白名单管辖；能力工具由 SDK 提供，租户不能通过白名单把自己配成「不能检索知识库」。</text>
<text class="lg" x="60" y="1166">数据型端口（知识库）可安全工具化，由模型按需调用；约束型端口（实体校验 / 参数枚举）走确定性通道，不依赖模型配合。</text>
<text class="lg" x="60" y="1186">本体是增强项：Ontologies.empty() 时放行全部校验，行为与接入前完全一致。</text>
</svg>