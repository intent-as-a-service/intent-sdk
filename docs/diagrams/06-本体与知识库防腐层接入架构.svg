<text class="ss" x="496" y="868" text-anchor="middle">Dify / RAGFlow / 向量库</text>
<text class="ss" x="496" y="886" text-anchor="middle">客户已建成则直连</text>
<rect x="656" y="826" width="272" height="84" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
