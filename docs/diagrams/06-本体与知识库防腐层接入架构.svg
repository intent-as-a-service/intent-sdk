<rect x="716" y="606" width="144" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
<text class="an" x="788" y="618" text-anchor="middle" fill="#16a34a">确定性通道 · 注入上下文 / 校验入参</text>
