<text class="ss" x="1084" y="868" text-anchor="middle">DataHub / 自建元数据</text>
<text class="ss" x="1084" y="886" text-anchor="middle">外部系统 · 已建成则直连</text>
<rect x="44" y="950" width="1192" height="130" rx="10" ry="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" stroke-dasharray="6,4"/>
<text class="bd" x="58" y="971">基础设施层 · 客户的既有系统（SDK 不感知其形态）</text>
<rect x="64" y="984" width="272" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="200" y="1006" text-anchor="middle">AI 知识库 RAG</text>
<text class="ss" x="200" y="1026" text-anchor="middle">向量检索 + Rerank</text>
<text class="ss" x="200" y="1044" text-anchor="middle">AiKnowledgeSegmentServiceImpl</text>
<rect x="360" y="984" width="272" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="496" y="1006" text-anchor="middle">外部知识库</text>
<text class="ss" x="496" y="1026" text-anchor="middle">HTTP / SDK</text>
<text class="ss" x="496" y="1044" text-anchor="middle">Dify / RAGFlow / Milvus</text>
<rect x="656" y="984" width="272" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="792" y="1006" text-anchor="middle">实体校验服务</text>
<text class="ss" x="792" y="1026" text-anchor="middle">crm.Customer / crm.Contract</text>
<text class="ss" x="792" y="1044" text-anchor="middle">宿主既有 Service（不新建）</text>
<rect x="952" y="984" width="264" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text class="ts" x="1084" y="1006" text-anchor="middle">数据字典 / Catalog</text>
<text class="ss" x="1084" y="1026" text-anchor="middle">元数据平台</text>
<text class="ss" x="1084" y="1044" text-anchor="middle">客户已建成则直连</text>
