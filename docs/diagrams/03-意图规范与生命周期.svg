<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">意图规范与生命周期 —— 规范化是 AI 结果可信的基石</text>
  <text x="255" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">IntentSpec · 意图规范五要素</text>
  <rect x="60" y="90" width="390" height="296" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="60" y="90" width="390" height="34" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="255" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">IntentSpec（意图规范文档）</text>
  <line x1="60" y1="124" x2="450" y2="124" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="145" font-size="13" font-weight="600" fill="#111827">① 标识与元数据</text>
  <text x="76" y="164" font-size="11" fill="#6b7280">intent_id（系统.域.动作）· 版本 · 状态</text>
  <line x1="60" y1="176" x2="450" y2="176" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="197" font-size="13" font-weight="600" fill="#111827">② 输入规范</text>
  <text x="76" y="216" font-size="11" fill="#6b7280">参数 JSON Schema · 上下文声明</text>
  <line x1="60" y1="228" x2="450" y2="228" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="249" font-size="13" font-weight="600" fill="#111827">③ 执行编排</text>
  <text x="76" y="268" font-size="11" fill="#6b7280">scope：本地/远程/组合 · DAG：ai/api/tool/cond/human</text>
  <line x1="60" y1="280" x2="450" y2="280" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="301" font-size="13" font-weight="600" fill="#111827">④ 输出规范</text>
  <text x="76" y="320" font-size="11" fill="#6b7280">结果 JSON Schema · 渲染契约（卡片 / 表单）</text>
  <line x1="60" y1="332" x2="450" y2="332" stroke="#e5e7eb" stroke-width="1"/>
  <text x="76" y="353" font-size="13" font-weight="600" fill="#111827">⑤ 治理策略</text>
  <text x="76" y="372" font-size="11" fill="#6b7280">角色 · 限流 · 审计 · 兜底 · 评测用例集</text>
  <rect x="60" y="410" width="390" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="255" y="433" text-anchor="middle" font-size="11.5" fill="#166534">规范校验器在执行前后强制校验 ②/④，</text>
  <text x="255" y="452" text-anchor="middle" font-size="11.5" fill="#166534">未通过自动重试一次，仍失败降级人工表单</text>
  <text x="715" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">意图生命周期 · 后台管理</text>
  <rect x="560" y="100" width="310" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="576" y="120" font-size="13" font-weight="600" fill="#111827">1. 新建意图</text>
  <text x="576" y="138" font-size="11" fill="#6b7280">按规范表单填写 · 选编排模板</text>
  <rect x="560" y="172" width="310" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="576" y="192" font-size="13" font-weight="600" fill="#111827">2. 测试验证</text>
  <text x="576" y="210" font-size="11" fill="#6b7280">沙箱试跑 + 评测用例回归</text>
  <rect x="560" y="244" width="310" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="576" y="264" font-size="13" font-weight="600" fill="#111827">3. 发布</text>
  <text x="576" y="282" font-size="11" fill="#6b7280">灰度 → 全量 · 存入意图注册中心</text>
  <rect x="560" y="316" width="310" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="576" y="336" font-size="13" font-weight="600" fill="#111827">4. 生效</text>
  <text x="576" y="354" font-size="11" fill="#6b7280">各系统 SDK 动态拉取 · 零发版</text>
  <rect x="560" y="388" width="310" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="576" y="408" font-size="13" font-weight="600" fill="#111827">5. 运行</text>
  <text x="576" y="426" font-size="11" fill="#6b7280">监控调用量与结果可信度</text>
  <rect x="560" y="460" width="310" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="576" y="480" font-size="13" font-weight="600" fill="#111827">6. 迭代 / 下线</text>
  <text x="576" y="498" font-size="11" fill="#6b7280">反馈回流 · 持续改进</text>
  <line x1="715" y1="148" x2="715" y2="168" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="715" y1="220" x2="715" y2="240" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="715" y1="292" x2="715" y2="312" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="715" y1="364" x2="715" y2="384" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="715" y1="436" x2="715" y2="456" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="560" y1="268" x2="454" y2="268" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <rect x="452" y="240" width="112" height="18" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="508" y="253" text-anchor="middle" font-size="11" fill="#374151">发布 · 存入注册中心</text>
  <path d="M 870 484 C 925 500, 925 130, 874 122" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <g transform="translate(930 305) rotate(-90)">
    <rect x="-58" y="-11" width="116" height="22" rx="3" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" fill="#6b7280">反馈回流 · 持续迭代</text>
  </g>
  <text x="480" y="528" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">AI 结果可信 · 四道防线闭环</text>
  <rect x="90" y="540" width="150" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="165" y="559" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">入口校验</text>
  <text x="165" y="576" text-anchor="middle" font-size="10.5" fill="#4d7c0f">参数 Schema 强制校验</text>
  <rect x="300" y="540" width="150" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="375" y="559" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">执行留痕</text>
  <text x="375" y="576" text-anchor="middle" font-size="10.5" fill="#4d7c0f">编排可回放 · 全链路审计</text>
  <rect x="510" y="540" width="150" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="585" y="559" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">输出校验</text>
  <text x="585" y="576" text-anchor="middle" font-size="10.5" fill="#4d7c0f">结果 Schema + 置信标注</text>
  <rect x="720" y="540" width="150" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="795" y="559" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">反馈评测</text>
  <text x="795" y="576" text-anchor="middle" font-size="10.5" fill="#4d7c0f">线上反馈回流评测集</text>
  <line x1="240" y1="562" x2="296" y2="562" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="450" y1="562" x2="506" y2="562" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="660" y1="562" x2="716" y2="562" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="90" y1="616" x2="116" y2="616" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="122" y="620" font-size="11" fill="#6b7280">流程推进</text>
  <line x1="250" y1="616" x2="276" y2="616" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <text x="282" y="620" font-size="11" fill="#6b7280">发布 / 数据</text>
  <line x1="420" y1="616" x2="446" y2="616" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="452" y="620" font-size="11" fill="#6b7280">反馈迭代</text>
</svg>